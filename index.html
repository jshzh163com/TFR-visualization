<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learnable Time-Frequency Representation | Feature Visualization</title>
  <style>
    :root {
      --ink:#182127; --muted:#6a7479; --line:#dfe5e2; --paper:#f6f7f5;
      --panel:#ffffff; --accent:#176d79; --accent-soft:#e8f1f0; --hot:#c95745;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    button, select { font:inherit; }
    header {
      position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center;
      gap:14px; padding:14px 20px; background:#fff; border-bottom:1px solid var(--line);
    }
    h1 { margin:0; font-size:18px; line-height:1.25; }
    select { min-height:38px; border:1px solid var(--line); border-radius:7px; background:#fff; padding:0 10px; color:var(--ink); }
    main { max-width:1500px; margin:0 auto; padding:16px 18px 28px; }
    .pipeline {
      display:grid; grid-template-columns:repeat(5,minmax(120px,1fr)); gap:9px; margin-bottom:12px;
    }
    .stageBtn {
      min-height:48px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
      cursor:pointer; padding:8px 10px; font-weight:700;
    }
    .stageBtn.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
    .layers {
      display:flex; gap:7px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:thin;
    }
    .layerBtn {
      flex:0 0 auto; min-height:34px; border:1px solid var(--line); border-radius:7px; background:#fff;
      cursor:pointer; padding:0 11px; color:var(--ink); font-size:12px;
    }
    .layerBtn.active { border-color:var(--hot); color:var(--hot); font-weight:700; }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:12px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:9px; }
    .galleryPanel { padding:12px; min-width:0; }
    .detailPanel { padding:13px; align-self:start; position:sticky; top:82px; }
    .stageHead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .stageHead h2 { margin:0; font-size:15px; }
    .stageHead span { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(135px,1fr)); gap:9px; }
    .card { border:1px solid var(--line); border-radius:7px; overflow:hidden; background:#fff; cursor:pointer; }
    .card.active { border-color:var(--hot); box-shadow:0 0 0 2px rgba(201,87,69,.12); }
    .card img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#101820; }
    .cap { padding:7px 8px; font-size:11px; color:var(--ink); }
    .detailPanel img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#101820; border:1px solid var(--line); border-radius:7px; }
    .detailPanel h3 { margin:11px 0 0; font-size:14px; font-weight:700; }
    @media (max-width:980px) {
      .workspace { grid-template-columns:1fr; }
      .detailPanel { position:static; }
    }
    @media (max-width:720px) {
      header { align-items:flex-start; flex-direction:column; }
      .pipeline { grid-template-columns:1fr 1fr; }
      .stageBtn:last-child { grid-column:1/-1; }
    }
  </style>
</head>
<body>
<header>
  <h1>Learnable Time-Frequency Representation: Feature Visualization</h1>
  <select id="sampleSelect" aria-label="Select sample"></select>
</header>

<main>
  <nav id="pipeline" class="pipeline" aria-label="Model stages"></nav>

  <section class="workspace">
    <div class="panel galleryPanel">
      <div class="stageHead">
        <h2 id="stageTitle"></h2>
        <span id="countText"></span>
      </div>
      <div id="grid" class="grid"></div>
    </div>

    <aside id="detail" class="panel detailPanel"></aside>
  </section>
</main>

const labels = {
  input: 'Input Signal',
  TF_mapping_16_channel: 'TF Mapping',
  Encoder: 'Encoder',
  Decoder: 'Decoder',
  Final_output: 'Final TFR'
};
const state = { sample:0, stage:'input', layer:0, channel:0 };

function currentSample(){ return manifest.samples[state.sample]; }
function currentGroup(){ return currentSample().groups[state.stage]; }
function currentLayer(){ return currentGroup().layers[state.layer] || currentGroup().layers[0]; }

function stageLabel(key){ return labels[key] || key; }
function layerLabel(name){
  if(state.stage==='input') return 'Input Signal';
  if(state.stage==='TF_mapping_16_channel') return 'TF Mapping';
  if(state.stage==='Final_output') return 'Final TFR';
  if(state.stage==='Encoder') return name.replace('conv_','Encoder layer ' + String(Number(name.replace('conv_',''))+1).padStart(2,'0'));
  if(state.stage==='Decoder') return name.replace('deconv_','Decoder layer ' + String(Number(name.replace('deconv_',''))+1).padStart(2,'0'));
  return name;
}
function channelLabel(ch){
  if(state.stage==='input') return ch.index===0 ? 'Real part' : 'Imaginary part';
  if(state.stage==='Final_output') return 'Final TFR';
  return `Channel ${ch.index}`;
}

function renderSamples(){
  const el=document.getElementById('sampleSelect');
  el.innerHTML='';
  manifest.samples.forEach((s,i)=>{
    const o=document.createElement('option'); o.value=i; o.textContent=s.name; el.appendChild(o);
  });
  el.value=state.sample;
  el.onchange=()=>{ state.sample=Number(el.value); state.stage='input'; state.layer=0; state.channel=0; renderAll(); };
}

function renderPipeline(){
  const box=document.getElementById('pipeline'); box.innerHTML='';
  manifest.stageOrder.forEach(([key])=>{
    const b=document.createElement('button');
    b.type='button'; b.className='stageBtn'+(state.stage===key?' active':'');
    b.textContent=stageLabel(key);
    b.onclick=()=>{ state.stage=key; state.layer=0; state.channel=0; renderAll(); };
    box.appendChild(b);
  });
}

function renderLayers(){
  const box=document.getElementById('layers'); box.innerHTML='';
  const layers=currentGroup().layers;
  if(layers.length<=1) return;
  layers.forEach((layer,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='layerBtn'+(state.layer===i?' active':'');
    b.textContent=layerLabel(layer.name);
    b.onclick=()=>{ state.layer=i; state.channel=0; renderGallery(); renderLayers(); };
    box.appendChild(b);
  });
}

function renderGallery(){
  const layer=currentLayer();
  const channels=layer.channels;
  if(!channels.length) return;
  if(state.channel>=channels.length) state.channel=0;

  document.getElementById('stageTitle').textContent = `${stageLabel(state.stage)} · ${layerLabel(layer.name)}`;
  document.getElementById('countText').textContent = `${channels.length} image${channels.length===1?'':'s'}`;

  const grid=document.getElementById('grid'); grid.innerHTML='';
  channels.forEach((ch,i)=>{
    const card=document.createElement('div');
    card.className='card'+(state.channel===i?' active':'');
    const img=document.createElement('img'); img.src=ch.src; img.alt=channelLabel(ch); img.loading='lazy';
    const cap=document.createElement('div'); cap.className='cap'; cap.textContent=channelLabel(ch);
    card.append(img,cap);
    card.onclick=()=>{ state.channel=i; renderGallery(); };
    grid.appendChild(card);
  });

  const ch=channels[state.channel];
  const detail=document.getElementById('detail'); detail.innerHTML='';
  const img=document.createElement('img'); img.src=ch.src; img.alt=channelLabel(ch);
  const title=document.createElement('h3'); title.textContent=`${stageLabel(state.stage)} · ${layerLabel(layer.name)} · ${channelLabel(ch)}`;
  detail.append(img,title);
}

function renderAll(){ renderSamples(); renderPipeline(); renderLayers(); renderGallery(); }
renderAll();
</script>
