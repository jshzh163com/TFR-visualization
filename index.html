<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learnable Time-Frequency Representation | Feature Visualization</title>
  <style>
    :root {
      --ink:#182127; --muted:#6a7479; --line:#dfe5e2; --paper:#f6f7f5;
      --panel:#ffffff; --accent:#176d79; --accent-soft:#e8f1f0; --hot:#c95745;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    button, select { font:inherit; }
    header {
      position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center;
      gap:14px; padding:14px 20px; background:#fff; border-bottom:1px solid var(--line);
    }
    h1 { margin:0; font-size:18px; line-height:1.25; }
    main { max-width:1560px; margin:0 auto; padding:16px 18px 30px; }
    .sectionTitle { margin:0 0 10px; font-size:16px; }

    /* At-a-glance overview */
    .overview { display:grid; gap:12px; margin-bottom:24px; }
    .sampleOverview { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; }
    .sampleName { margin:0 0 9px; font-size:14px; font-weight:700; }
    .flow {
      display:grid; grid-template-columns:1.15fr 28px 1fr 28px 1fr 28px 1fr 28px 1.1fr;
      gap:8px; align-items:center;
    }
    .flowCard { min-width:0; }
    .flowCard h3 { margin:0 0 6px; font-size:12px; text-align:center; }
    .flowArrow { text-align:center; color:var(--muted); font-size:22px; }
    .miniGrid { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
    .miniGrid.single { grid-template-columns:1fr; }
    .miniItem { min-width:0; }
    .miniItem img {
      display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#101820;
      border:1px solid var(--line); border-radius:6px;
    }
    .miniCap { margin-top:3px; text-align:center; font-size:10px; color:var(--muted); }
    .finalPreview img { aspect-ratio:4/3; }

    /* Browser */
    .browserHead { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:4px 0 10px; }
    .browserHead h2 { margin:0; font-size:16px; }
    select { min-height:38px; border:1px solid var(--line); border-radius:7px; background:#fff; padding:0 10px; color:var(--ink); }
    .pipeline { display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); gap:9px; margin-bottom:12px; }
    .stageBtn {
      min-height:48px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
      cursor:pointer; padding:8px 10px; font-weight:700;
    }
    .stageBtn.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
    .layers { display:flex; gap:7px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:thin; }
    .layerBtn {
      flex:0 0 auto; min-height:34px; border:1px solid var(--line); border-radius:7px; background:#fff;
      cursor:pointer; padding:0 11px; color:var(--ink); font-size:12px;
    }
    .layerBtn.active { border-color:var(--hot); color:var(--hot); font-weight:700; }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:12px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:9px; }
    .galleryPanel { padding:12px; min-width:0; }
    .detailPanel { padding:13px; align-self:start; position:sticky; top:82px; }
    .stageHead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .stageHead h2 { margin:0; font-size:15px; }
    .stageHead span { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(135px,1fr)); gap:9px; }
    .workspace.comparisonMode { grid-template-columns:1fr; }
    .comparisonGrid {
      display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;
      max-width:980px; margin:0 auto;
    }
    .comparisonItem {
      border:1px solid var(--line); border-radius:8px; background:#fff; overflow:hidden; min-width:0;
    }
    .comparisonItem img {
      display:block; width:100%; height:300px; object-fit:contain; background:#101820;
    }
    .comparisonLabel {
      padding:7px 9px; text-align:center; font-size:12px; font-weight:700; color:var(--ink);
      border-top:1px solid var(--line);
    }
    .comparisonMissing {
      height:300px; display:flex; align-items:center; justify-content:center;
      background:#f3f5f4; color:var(--muted); font-size:12px; padding:12px; text-align:center;
    }
    .card { border:1px solid var(--line); border-radius:7px; overflow:hidden; background:#fff; cursor:pointer; }
    .card.active { border-color:var(--hot); box-shadow:0 0 0 2px rgba(201,87,69,.12); }
    .card img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#101820; }
    .cap { padding:7px 8px; font-size:11px; color:var(--ink); }
    .detailPanel img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#101820; border:1px solid var(--line); border-radius:7px; }
    .detailPanel h3 { margin:11px 0 0; font-size:14px; font-weight:700; }

    @media (max-width:1180px) {
      .flow { grid-template-columns:1fr 20px 1fr 20px 1fr; }
      .flowCard:nth-of-type(4), .flowCard:nth-of-type(5) { margin-top:8px; }
      .flowArrow:nth-of-type(6), .flowArrow:nth-of-type(8) { display:none; }
    }
    @media (max-width:980px) {
      .workspace { grid-template-columns:1fr; }
      .detailPanel { position:static; }
      .flow { grid-template-columns:1fr; }
      .flowArrow { display:none; }
      .flowCard { margin-top:0 !important; }
    }
    @media (max-width:720px) {
      header { align-items:flex-start; flex-direction:column; }
      .browserHead { align-items:flex-start; flex-direction:column; }
      .pipeline { grid-template-columns:1fr 1fr; }
      .comparisonGrid { grid-template-columns:1fr; }
      .comparisonItem img, .comparisonMissing { height:260px; }
    }
  </style>
</head>
<body>
<header>
  <h1>Learnable Time-Frequency Representation: Feature Visualization</h1>
</header>

<main>
  <h2 class="sectionTitle">Overview</h2>
  <section id="overview" class="overview"></section>

  <div class="browserHead">
    <h2>Browse feature maps</h2>
    <select id="sampleSelect" aria-label="Select sample"></select>
  </div>

  <nav id="pipeline" class="pipeline" aria-label="Model stages"></nav>
  <div id="layers" class="layers"></div>

  <section class="workspace">
    <div class="panel galleryPanel">
      <div class="stageHead">
        <h2 id="stageTitle"></h2>
        <span id="countText"></span>
      </div>
      <div id="grid" class="grid"></div>
    </div>

    <aside id="detail" class="panel detailPanel"></aside>
  </section>
</main>

// Add the comparison images stored separately from model inputs/outputs.
manifest.stageOrder.push(["Comparison", "Comparison"]);
manifest.samples.forEach(sample => {
  sample.groups.Comparison = {
    key: "Comparison",
    label: "Comparison",
    layers: [{
      name: "Comparison",
      channels: [
        { index: 0, label: "IF reference", src: `assets/${sample.id}/Final_output/Final_output/IF_reference.png`, optional: true },
        { index: 1, label: "STFT · short window", src: `assets/${sample.id}/Final_output/Final_output/STFT_result_short_window.png`, optional: true },
        { index: 2, label: "STFT · long window", src: `assets/${sample.id}/Final_output/Final_output/STFT_result_long_window.png`, optional: true }
      ]
    }]
  };
});

const labels = {
  input: 'Input Signal',
  TF_mapping_16_channel: 'TF Mapping',
  Encoder: 'Encoder',
  Decoder: 'Decoder',
  Final_output: 'Final TFR',
  Comparison: 'Comparison'
};
const state = { sample:0, stage:'input', layer:0, channel:0 };

function currentSample(){ return manifest.samples[state.sample]; }
function currentGroup(){ return currentSample().groups[state.stage]; }
function currentLayer(){ return currentGroup().layers[state.layer] || currentGroup().layers[0]; }
function stageLabel(key){ return labels[key] || key; }

function layerLabel(name){
  if(state.stage==='input') return 'Input Signal';
  if(state.stage==='TF_mapping_16_channel') return 'TF Mapping';
  if(state.stage==='Final_output') return 'Final TFR';
  if(state.stage==='Comparison') return 'Comparison';
  if(state.stage==='Encoder') return 'Encoder layer ' + String(Number(name.replace('conv_',''))+1).padStart(2,'0');
  if(state.stage==='Decoder') return 'Decoder layer ' + String(Number(name.replace('deconv_',''))+1).padStart(2,'0');
  return name;
}
function channelLabel(ch){
  if(ch.label) return ch.label;
  if(state.stage==='input') return ch.index===0 ? 'Real part' : 'Imaginary part';
  if(state.stage==='Final_output') return 'Final TFR';
  return `Channel ${ch.index}`;
}



function safeChannel(layer, index){
  if(!layer || !layer.channels || !layer.channels.length) return null;
  return layer.channels[Math.min(index, layer.channels.length-1)];
}
function imageItem(ch, caption=''){
  if(!ch) return '';
  return `<div class="miniItem"><img src="${ch.src}" alt="${caption}">${caption ? `<div class="miniCap">${caption}</div>` : ''}</div>`;
}
function stageMosaic(group, layerIndex, channelIndices, captions=false){
  const layer = group.layers[Math.min(layerIndex, group.layers.length-1)];
  return channelIndices.map(i => imageItem(safeChannel(layer,i), captions ? `Ch. ${i}` : '')).join('');
}

function renderOverview(){
  const box=document.getElementById('overview');
  box.innerHTML='';
  manifest.samples.forEach((sample)=>{
    const inputLayer=sample.groups.input.layers[0];
    const tfGroup=sample.groups.TF_mapping_16_channel;
    const encGroup=sample.groups.Encoder;
    const decGroup=sample.groups.Decoder;
    const finalLayer=sample.groups.Final_output.layers[0];

    const encIndex=Math.min(9, encGroup.layers.length-1);
    const decIndex=Math.min(14, decGroup.layers.length-1);

    const wrap=document.createElement('article');
    wrap.className='sampleOverview';
    wrap.innerHTML=`
      <div class="sampleName">${sample.name}</div>
      <div class="flow">
        <div class="flowCard">
          <h3>Input</h3>
          <div class="miniGrid">
            ${imageItem(safeChannel(inputLayer,0),'Real')}
            ${imageItem(safeChannel(inputLayer,1),'Imaginary')}
          </div>
        </div>
        <div class="flowArrow">→</div>
        <div class="flowCard">
          <h3>TF Mapping</h3>
          <div class="miniGrid">${stageMosaic(tfGroup,0,[0,5,11,15])}</div>
        </div>
        <div class="flowArrow">→</div>
        <div class="flowCard">
          <h3>Encoder</h3>
          <div class="miniGrid">${stageMosaic(encGroup,encIndex,[0,8,16,24])}</div>
        </div>
        <div class="flowArrow">→</div>
        <div class="flowCard">
          <h3>Decoder</h3>
          <div class="miniGrid">${stageMosaic(decGroup,decIndex,[3,8,13,15])}</div>
        </div>
        <div class="flowArrow">→</div>
        <div class="flowCard finalPreview">
          <h3>Final TFR</h3>
          <div class="miniGrid single">${imageItem(safeChannel(finalLayer,0))}</div>
        </div>
      </div>`;
    box.appendChild(wrap);
  });
}

function renderSamples(){
  const el=document.getElementById('sampleSelect');
  el.innerHTML='';
  manifest.samples.forEach((s,i)=>{
    const o=document.createElement('option'); o.value=i; o.textContent=s.name; el.appendChild(o);
  });
  el.value=state.sample;
  el.onchange=()=>{ state.sample=Number(el.value); state.stage='input'; state.layer=0; state.channel=0; renderBrowser(); };
}
function renderPipeline(){
  const box=document.getElementById('pipeline'); box.innerHTML='';
  manifest.stageOrder.forEach(([key])=>{
    const b=document.createElement('button');
    b.type='button'; b.className='stageBtn'+(state.stage===key?' active':'');
    b.textContent=stageLabel(key);
    b.onclick=()=>{ state.stage=key; state.layer=0; state.channel=0; renderBrowser(); };
    box.appendChild(b);
  });
}
function renderLayers(){
  const box=document.getElementById('layers'); box.innerHTML='';
  const layers=currentGroup().layers;
  if(layers.length<=1) return;
  layers.forEach((layer,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='layerBtn'+(state.layer===i?' active':'');
    const prevStage=state.stage;
    if(prevStage==='Encoder') b.textContent='Encoder layer ' + String(i+1).padStart(2,'0');
    else if(prevStage==='Decoder') b.textContent='Decoder layer ' + String(i+1).padStart(2,'0');
    else b.textContent=layer.name;
    b.onclick=()=>{ state.layer=i; state.channel=0; renderGallery(); renderLayers(); };
    box.appendChild(b);
  });
}
function renderGallery(){
  const workspace=document.querySelector('.workspace');
  const grid=document.getElementById('grid');
  const detail=document.getElementById('detail');

  if(state.stage==='Comparison'){
    workspace.classList.add('comparisonMode');
    detail.style.display='none';
    document.getElementById('stageTitle').textContent='Comparison';
    document.getElementById('countText').textContent='4 images';
    grid.className='comparisonGrid';
    grid.innerHTML='';

    const sample=currentSample();
    const finalCh=sample.groups.Final_output.layers[0].channels[0];
    const base=`assets/${sample.id}`;
    const items=[
      {
        label:'Reference IF',
        candidates:[`${base}/Final_output/Final_output/IF_reference.png`]
      },
      {label:'Proposed method · Final TFR', candidates:[finalCh.src]},
      {
        label:'STFT · short window',
        candidates:[`${base}/Final_output/Final_output/STFT_result_short_window.png`]
      },
      {
        label:'STFT · long window',
        candidates:[`${base}/Final_output/Final_output/STFT_result_long_window.png`]
      }
    ];

    function setImageWithFallback(img, candidates, onMissing){
      let i=0;
      const tryNext=()=>{
        if(i>=candidates.length){ onMissing(); return; }
        img.src=candidates[i++];
      };
      img.onerror=tryNext;
      tryNext();
    }

    items.forEach(item=>{
      const card=document.createElement('div');
      card.className='comparisonItem';
      const img=document.createElement('img');
      img.alt=item.label;
      img.loading='lazy';
      const label=document.createElement('div');
      label.className='comparisonLabel';
      label.textContent=item.label;
      card.append(img,label);
      grid.appendChild(card);
      setImageWithFallback(img,item.candidates,()=>{
        const missing=document.createElement('div');
        missing.className='comparisonMissing';
        missing.textContent='Image not available for this sample.';
        img.replaceWith(missing);
      });
    });
    return;
  }

  workspace.classList.remove('comparisonMode');
  detail.style.display='';
  grid.className='grid';

  const layer=currentLayer();
  const channels=layer.channels;
  if(!channels.length) return;
  if(state.channel>=channels.length) state.channel=0;

  {
    const sLabel = stageLabel(state.stage);
    const lLabel = layerLabel(layer.name);
    document.getElementById('stageTitle').textContent = (sLabel === lLabel) ? sLabel : `${sLabel} · ${lLabel}`;
  }
  document.getElementById('countText').textContent = `${channels.length} image${channels.length===1?'':'s'}`;

  grid.innerHTML='';
  channels.forEach((ch,i)=>{
    const card=document.createElement('div');
    card.className='card'+(state.channel===i?' active':'');
    const img=document.createElement('img'); img.src=ch.src; img.alt=channelLabel(ch); img.loading='lazy';
    if(ch.optional) img.onerror=()=>{ card.remove(); };
    const cap=document.createElement('div'); cap.className='cap'; cap.textContent=channelLabel(ch);
    card.append(img,cap);
    card.onclick=()=>{ state.channel=i; renderGallery(); };
    grid.appendChild(card);
  });

  const ch=channels[state.channel];
  detail.innerHTML='';
  const img=document.createElement('img'); img.src=ch.src; img.alt=channelLabel(ch);
  if(ch.optional) img.onerror=()=>{ detail.innerHTML='<div style="color:var(--muted);font-size:13px;">Image not available for this sample.</div>'; };
  const title=document.createElement('h3');
  {
    const sLabel = stageLabel(state.stage);
    const lLabel = layerLabel(layer.name);
    const prefix = (sLabel === lLabel) ? sLabel : `${sLabel} · ${lLabel}`;
    title.textContent = `${prefix} · ${channelLabel(ch)}`;
  }
  detail.append(img,title);
}
function renderBrowser(){ renderSamples(); renderPipeline(); renderLayers(); renderGallery(); }
renderOverview();
renderBrowser();
</script>
